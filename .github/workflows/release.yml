name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compute version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=${arch} \
              go build -trimpath \
              -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" \
              -o dist/ecs-guardian-linux-${arch} .
          done
          (cd dist && sha256sum ecs-guardian-* > SHA256SUMS)

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.IMAGE_NAME }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ecs-guardian
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
          flavor: |
            latest=auto

      - name: Build and push images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.version.outputs.version }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ecs-guardian ${{ steps.version.outputs.version }}
          files: |
            dist/ecs-guardian-linux-amd64
            dist/ecs-guardian-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            ## ecs-guardian ${{ steps.version.outputs.version }}

            Docker 镜像（linux/amd64 + linux/arm64）：
            - GHCR: `ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}`
            ${{ env.DOCKERHUB_USERNAME != '' && format('- Docker Hub: `docker.io/{0}/ecs-guardian:{1}`', env.DOCKERHUB_USERNAME, steps.version.outputs.version) || '' }}

            使用方式见 [README](https://github.com/${{ github.repository }}/#readme)。

            本项目源自 [10000ge10000/aliyun_monitor](https://github.com/10000ge10000/aliyun_monitor)。
